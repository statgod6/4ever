# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.override.yml
#
# Automatically loaded on top of docker-compose.yml when you run
# `docker compose up` locally. Re-enables dev-mode conveniences that MUST NOT
# ship to production:
#
#   • Bind-mounts ./backend source for hot reload (start:dev)
#   • Bind-mounts ./frontend for Vite HMR (if you build the dev image)
#   • NODE_ENV=development
#
# For a production build run WITHOUT this override:
#   docker compose -f docker-compose.yml up --build
#
# (The CLI only auto-loads docker-compose.override.yml, so the `-f` with just
# the base file is enough to skip it.)
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]
    volumes:
      # Bind-mount source for live reload. node_modules is isolated so the
      # host's install never shadows the container's Linux-specific binaries
      # (e.g., the Prisma query engine).
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  backend_node_modules:

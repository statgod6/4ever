services:
  postgres:
    image: ankane/pgvector:latest
    container_name: thinkingos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thinkingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkingos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thinkingos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thinkingos} -d ${POSTGRES_DB:-thinkingos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinkingos-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-thinkingos}:${POSTGRES_PASSWORD:-thinkingos_secret}@postgres:5432/${POSTGRES_DB:-thinkingos}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thinkingos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
